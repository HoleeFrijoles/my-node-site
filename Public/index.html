<!-- I used css variable to make an animation for the nav links on my site, i used animations to make a cool looking effect so the text hovers up when the user hovers over the links -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- I am using REM instead of pixels so the font size will adapt to the size of the screen its on.  -->
    <nav class="navbar">
        <a href="/"><img class="logo" src="logo.png"></a>
        <br>
        <div class="hamburger" onclick="toggleMenu()">
            <img class="menu" src="menu.png">
        </div>
        <ul class="nav-links">
            <li class="header link"><a href="/">Home</a></li>
            <li class="header link"><a href="/about">About</a></li>
            <li class="header link"><a href="/contact">Contact</a></li>
            <li class="header link"><a href="/info">FAQ</a></li>
        </ul>
    </nav>

    <hr>

    <h1 class="header">Homepage</h1>

    <p>This is my homepage. Welcome to my website!</p>

    <img class="home" loading="lazy" src="https://upload.wikimedia.org/wikipedia/commons/2/22/GABRIEL_VELLA_vs_ROMINHO_51.jpg">

    <footer>No way! You found this! I'm so proud!</footer>
    <script>
        function toggleMenu() {
            document.querySelector('.nav-links').classList.toggle('active');
        }

        const press = document.querySelector('li');

        press.addEventListener('click', function() {
            press.classList.toggle('nav');
        });
    </script>
</body>
</html>
